name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Single source of truth: the packageManager field.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check-types

      - name: Lint frontend
        run: bun run --cwd apps/frontend lint

      - name: Test API
        run: bun run --cwd apps/api test
